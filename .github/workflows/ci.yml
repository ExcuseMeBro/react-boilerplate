name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        id: node
        with:
          node-version-file: .node-version
      - name: Use the declared npm version
        run: npm install --global npm@11.16.0
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node.outputs.node-version }}-npm-11.16.0-${{ hashFiles('package-lock.json') }}
      - name: Install locked dependencies
        run: npm ci
      - name: Format, lint and types
        run: npm run check
      - name: Unit and route tests
        run: npm test
      - name: Bootstrap temporary-copy tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Production build
        run: npm run build
      - name: Verify lazy chunks and report initial JS
        run: node scripts/bundle-size.mjs dist --assert-lazy
      - name: Audit all dependencies
        run: npm run audit
